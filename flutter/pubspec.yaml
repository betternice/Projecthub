name: nice
description: Niceflix — Android TV movie app from OneDrive MKV files
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cached_network_image: ^4.0.7
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.5.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
